name: collect
on:
  workflow_dispatch:
    inputs:
      reason:
        description: why run
        required: false
  schedule:
    - cron: '0 3 * * 1'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run validate
      - run: |
          git config user.name "hcb-bot"
          git config user.email "hcb-bot@users.noreply.github.com"
          git add data
          git diff --quiet && exit 0
          git commit -m "chore: weekly HCB snapshot"
          git push origin HEAD:main
